name: vibestack
version: 1.0.0
schema: https://vibestack.dev/schema/v1

identity:
  statement: universal ai operational context layer
  motto: the model changes, the context remains

compatibility:
  runtimes:
    - claude-code
    - gemini-cli
    - codex
    - cursor
    - openclaude
    - ollama
    - openhands
    - roo
    - cline
    - aider
  upcoming:
    - openclaw

defaults:
  stack:
    frontend: react-vite-typescript-tailwind
    backend: node-fastify
    database: postgres
    orm: drizzle
    queue: redis-bullmq
    auth: better-auth
    ai_gateway: litellm
    observability: posthog
